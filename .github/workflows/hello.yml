name: Hello World!

on:
  push:
    branches:
      - main

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say hello
        run: |
          echo "Hello World!"
      - name: Print date
        run: date
      - name: List files in the repository
        run: |
          echo "The repository ${{ github.repository }} contains:"
          ls -a
